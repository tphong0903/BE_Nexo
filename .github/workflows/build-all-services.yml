name: Build and Push All Services

on:
  push:
    branches:
      - develop
      - master
      - feature/recommendation-service
    paths:
      - "services/**"
      - ".github/workflows/build-all-services.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    environment: ${{ vars.GITHUB_ENVIRONMENT_NAME || 'dockerhub' }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ai-service
            image: ai-service
            build_tool: none
          - service: api-gateway
            image: api-gateway
            build_tool: maven
          - service: auth-service
            image: auth-service
            build_tool: maven
          - service: eureka-server
            image: eureka-server
            build_tool: maven
          - service: feed-service
            image: feed-service
            build_tool: maven
          - service: interaction-service
            image: interaction-service
            build_tool: maven
          - service: messaging-service
            image: messaging-service
            build_tool: maven
          - service: notification-service
            image: notification-service
            build_tool: maven
          - service: post-service
            image: post-service
            build_tool: maven
          - service: recommendation-service
            image: recommendation-service
            build_tool: none
          - service: upload-file-service
            image: upload-file-service
            build_tool: maven
          - service: user-service
            image: user-service
            build_tool: maven

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ matrix.build_tool == 'maven' }}
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        if: ${{ matrix.build_tool == 'maven' }}
        working-directory: ./services/${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
