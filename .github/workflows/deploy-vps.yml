name: Deploy to VPS

on:
  push:
    branches:
      - deploy
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Kéo code từ GitHub Repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Copy file cấu hình lên VPS
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          # Copy docker-compose, prometheus và nginx config
          source: "docker-compose.prod.yml,prometheus.yml,nginx/,themes/"
          target: "/opt/BE_Nexo"

      # Bước 3: SSH vào VPS và Deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # Di chuyển vào thư mục dự án
            mkdir -p /opt/BE_Nexo
            cd /opt/BE_Nexo

            # Xóa thư mục sai nếu Docker đã tạo nhầm (file bị tạo thành dir)
            [ -d nginx/nginx.conf ] && rm -rf nginx/nginx.conf || true
            [ -d nginx/nginx.init.conf ] && rm -rf nginx/nginx.init.conf || true

            # Dọn container nginx-init (từ init-ssl.sh) nếu còn sót → tránh port 80 conflict
            docker rm -f nginx-init 2>/dev/null || true

            # Kiểm tra Docker Compose V2
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              echo "Docker Compose v2 is not installed" >&2
              exit 1
            fi

            # Lấy tên network của project
            NETWORK="be_nexo_nexo-network"

            # Ngắt kết nối các container ngoài compose khỏi network
            # để tránh lỗi "network has active endpoints" khi Docker cố xóa/tạo lại network
            echo "Ngắt kết nối container ngoài khỏi network..."
            for container in nginx certbot; do
              docker network disconnect "$NETWORK" "$container" 2>/dev/null || true
            done

            # Kéo image mới (bật cả 2 profile để không bị coi là orphan)
            echo "Đang kéo image..."
            $DC -f docker-compose.prod.yml --profile core --profile monitoring pull

            # Khởi chạy / cập nhật container
            echo "Đang khởi chạy container..."
            $DC -f docker-compose.prod.yml --profile core --profile monitoring up -d --remove-orphans

            # Kết nối lại các container ngoài vào network sau khi compose xong
            echo "Kết nối lại container ngoài vào network..."
            for container in nginx certbot; do
              docker network connect "$NETWORK" "$container" 2>/dev/null || true
            done

            echo "Deploy hoàn tất!"