name: Deploy to VPS

on:
  push:
    branches:
      - deploy
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Kéo code từ GitHub Repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Copy file cấu hình lên VPS
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          # Copy docker-compose, prometheus và nginx config
          source: "docker-compose.prod.yml,prometheus.yml,nginx/,themes/"
          target: "/opt/BE_Nexo"

      # Bước 3: SSH vào VPS và Deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # Di chuyển vào thư mục dự án
            mkdir -p /opt/BE_Nexo
            cd /opt/BE_Nexo

            # Xóa thư mục sai nếu Docker đã tạo nhầm (file bị tạo thành dir)
            [ -d nginx/nginx.conf ] && rm -rf nginx/nginx.conf || true
            [ -d nginx/nginx.init.conf ] && rm -rf nginx/nginx.init.conf || true

            # Dọn container nginx-init (từ init-ssl.sh) nếu còn sót → tránh port 80 conflict
            docker rm -f nginx-init 2>/dev/null || true

            # Kiểm tra Docker Compose V2
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              echo "Docker Compose v2 is not installed" >&2
              exit 1
            fi

            # Lấy tên network của project
            NETWORK="be_nexo_nexo-network"

            # ── Xử lý các container ngoài compose (nginx, certbot) ──────────────
            # Những container này có thể đang bám vào network hoặc mang label
            # của project cũ → gây lỗi khi compose cố xóa/tạo lại network.
            # Giải pháp: stop hẳn trước deploy, restart sau.
            echo "Dừng container ngoài trước khi deploy..."
            for container in nginx certbot; do
              if docker inspect "$container" >/dev/null 2>&1; then
                docker stop "$container" >/dev/null 2>&1 || true
              fi
            done

            # ── Kéo image mới ────────────────────────────────────────────────────
            echo "Đang kéo image..."
            $DC -f docker-compose.prod.yml --profile core --profile monitoring pull

            # ── Khởi chạy / cập nhật toàn bộ container ──────────────────────────
            echo "Đang khởi chạy container..."
            $DC -f docker-compose.prod.yml --profile core --profile monitoring up -d --remove-orphans

            # ── Khởi động lại container ngoài sau khi compose xong ───────────────
            echo "Khởi động lại container ngoài..."
            for container in nginx certbot; do
              if docker inspect "$container" >/dev/null 2>&1; then
                docker start "$container" >/dev/null 2>&1 || true
                # Kết nối lại vào network nếu chưa có
                docker network connect "$NETWORK" "$container" >/dev/null 2>&1 || true
              fi
            done

            echo "✅ Deploy hoàn tất!"