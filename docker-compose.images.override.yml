services:
  ai-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/ai-service:${AI_SERVICE_TAG:-latest}
    pull_policy: always
    ports:
      - "${AI_SERVICE_HTTP_PORT:-8010}:8000"
      - "${AI_SERVICE_GRPC_PORT:-50051}:50051"
    environment:
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      GRPC_PORT: 50051
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      EUREKA_APP_NAME: ai-service
      EUREKA_INSTANCE_HOST: ai-service
      DB_USER: ${DB_USER:-user}
      DB_PASS: ${DB_PASS:-pass}
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: ${USER_DB:-userdb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: Admin@123
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/api-gateway:${API_GATEWAY_TAG:-latest}
    pull_policy: always

  auth-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/auth-service:${AUTH_SERVICE_TAG:-latest}
    pull_policy: always

  user-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/user-service:${USER_SERVICE_TAG:-latest}
    pull_policy: always

  recommendation-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/recommendation-service:${RECOMMENDATION_TAG:-latest}
    pull_policy: always

  recommendation-consumer:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/recommendation-service:${RECOMMENDATION_TAG:-latest}
    pull_policy: always

  recommendation-worker:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/recommendation-service:${RECOMMENDATION_TAG:-latest}
    pull_policy: always

  recommendation-beat:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/recommendation-service:${RECOMMENDATION_TAG:-latest}
    pull_policy: always

  post-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/post-service:${POST_SERVICE_TAG:-latest}
    pull_policy: always

  upload-file-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/upload-file-service:${UPLOAD_FILE_SERVICE_TAG:-latest}
    pull_policy: always

  eureka-server:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/eureka-server:${EUREKA_SERVER_TAG:-latest}
    pull_policy: always

  feed-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/feed-service:${FEED_SERVICE_TAG:-latest}
    pull_policy: always

  interaction-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/interaction-service:${INTERACTION_SERVICE_TAG:-latest}
    pull_policy: always

  messaging-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/messaging-service:${MESSAGING_SERVICE_TAG:-latest}
    pull_policy: always

  notification-service:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/notification-service:${NOTIFICATION_SERVICE_TAG:-latest}
    pull_policy: always
