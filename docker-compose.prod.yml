x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

x-network: &network
  networks:
    - nexo-network

x-java-opts-small: &java-opts-small
  JAVA_TOOL_OPTIONS: >-
    -Duser.timezone=Asia/Ho_Chi_Minh
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:InitialRAMPercentage=40.0
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+UseStringDeduplication
    -Xss256k
    -Djava.security.egd=file:/dev/./urandom

x-hikari-small: &hikari-small
  SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE: "2"
  SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT: "20000"
  SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT: "300000"

x-userdb-env: &userdb-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
  SPRING_DATASOURCE_USERNAME: user
  SPRING_DATASOURCE_PASSWORD: pass
  <<: *hikari-small

x-redis-env: &redis-env
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: Admin@123

x-keycloak-jwt: &keycloak-jwt
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://keycloak:8080/realms/nexo-network
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/nexo-network/protocol/openid-connect/certs

x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

x-kafka-env: &kafka-env
  SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9097

x-rec-env: &rec-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: Admin@123
  REDIS_TTL_SECONDS: "3600"
  USER_SERVICE_BASE_URL: http://user-service:8085
  INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9097
  KAFKA_TOPIC_USER_EVENTS: user_events
  DEFAULT_TOP_K: "10"
  EMBEDDING_DIM: "32"
  CELERY_BROKER_URL: redis://:Admin@123@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:Admin@123@redis:6379/2
  TRANSFORMERS_VERBOSITY: error

x-res-tiny: &res-tiny
  deploy:
    resources:
      limits:
        cpus: "0.20"
        memory: 192M
      reservations:
        cpus: "0.05"
        memory: 96M

x-res-small: &res-small
  deploy:
    resources:
      limits:
        cpus: "0.40"
        memory: 320M
      reservations:
        cpus: "0.10"
        memory: 160M

x-res-medium: &res-medium
  deploy:
    resources:
      limits:
        cpus: "0.60"
        memory: 448M
      reservations:
        cpus: "0.15"
        memory: 224M

x-res-large: &res-large
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 640M
      reservations:
        cpus: "0.20"
        memory: 320M

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c wal_buffers=4MB
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    profiles: ["core"]
    <<: [*network]
    logging: *default-logging
    command: start-dev
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9090
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      JAVA_OPTS_APPEND: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:+UseG1GC
        -Xss256k
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    volumes:
      - ./themes:/opt/keycloak/themes
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.20"
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    command: >
      redis-server
        --requirepass Admin@123
        --appendonly yes
        --notify-keyspace-events Ex
        --maxmemory 180mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 224M
        reservations:
          cpus: "0.05"
          memory: 112M

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      POSTGRES_DB: ${USER_DB:-userdb}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASS:-pass}
    volumes:
      - user-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    command: >
      postgres
        -c max_connections=120
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c wal_buffers=8MB
        -c checkpoint_completion_target=0.9
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 192M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 96M

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9097:9097"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9097,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9097,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=20
        -XX:InitiatingHeapOccupancyPercent=35
        -XX:+ExplicitGCInvokesConcurrent
        -XX:+UseStringDeduplication
      KAFKA_LOG_RETENTION_HOURS: 12
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 30000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 30000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9097 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 640M
        reservations:
          cpus: "0.30"
          memory: 320M

  meilisearch:
    image: getmeili/meilisearch:v1.25.0
    container_name: meilisearch
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 224M
        reservations:
          cpus: "0.05"
          memory: 112M

  eureka-server:
    image: phongga088/eureka-server:latest
    container_name: eureka-server
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<: [*java-opts-small, *eureka-env]
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8761/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  api-gateway:
    image: phongga088/api-gateway:latest
    container_name: api-gateway
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<: [*java-opts-small, *eureka-env]
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started

  auth-service:
    image: phongga088/auth-service:latest
    container_name: auth-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<: [*java-opts-small, *eureka-env, *redis-env]
      KEYCLOAK_SERVERURL: http://keycloak:8080
      GRPC_SERVER_PORT: "9099"
      GRPC_CLIENT_USER_SERVICE_ADDRESS: static://user-service:9092
    ports:
      - "8081:8081"
      - "9099:9099"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started

  user-service:
    image: phongga088/user-service:latest
    container_name: user-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-medium]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [
          *java-opts-small,
          *eureka-env,
          *userdb-env,
          *redis-env,
          *keycloak-jwt,
          *kafka-env,
        ]
      GRPC_SERVER_PORT: "9092"
      GRPC_CLIENT_UPLOAD-FILE-SERVICE_ADDRESS: static://upload-file-service:9093
      GRPC_CLIENT_AUTH-SERVICE_ADDRESS: static://auth-service:9099
      GRPC_CLIENT_POST-SERVICE_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POST_NEGOTIATION_TYPE: plaintext
      GRPC_CLIENT_MESSAGING-SERVICE_ADDRESS: static://messaging-service:9098
      GRPC_CLIENT_INTERACTION-SERVICE_ADDRESS: static://interaction-service:9095
      GRPC_CLIENT_INTERACTION_NEGOTIATION_TYPE: plaintext
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_APIKEY: masterKey
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
    ports:
      - "8085:8085"
      - "9092:9092"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8085/actuator/health || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s

  post-service:
    image: phongga088/post-service:latest
    container_name: post-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [
          *java-opts-small,
          *eureka-env,
          *userdb-env,
          *redis-env,
          *keycloak-jwt,
          *kafka-env,
        ]
      SERVER_PORT: "8087"
      SPRING_KAFKA_PRODUCER_KEY-SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "true"
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
      SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS: "false"
      SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_GROUP-ID: story-deleter-group
      SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: earliest
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_KEY_DELEGATE_CLASS: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_VALUE_DELEGATE_CLASS: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: org.nexo.postservice.dto.StoryDeletionEvent
      GRPC_SERVER_PORT: "9094"
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
      GRPC_CLIENT_INTERACTIONS_ADDRESS: static://interaction-service:9095
      GRPC_CLIENT_INTERACTIONS_NEGOTIATION_TYPE: plaintext
    ports:
      - "8087:8087"
      - "9094:9094"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy

  feed-service:
    image: phongga088/feed-service:latest
    container_name: feed-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [
          *java-opts-small,
          *eureka-env,
          *userdb-env,
          *redis-env,
          *keycloak-jwt,
          *kafka-env,
        ]
      SERVER_PORT: "8084"
      SPRING_KAFKA_CONSUMER_GROUP-ID: feed-service-group
      SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: earliest
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_VALUE_DELEGATE_CLASS: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: org.nexo.feedservice.dto.MessagePostDTO
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED-PACKAGES: org.nexo
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POSTS_NEGOTIATION_TYPE: plaintext
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      post-service:
        condition: service_started
      user-service:
        condition: service_healthy

  interaction-service:
    image: phongga088/interaction-service:latest
    container_name: interaction-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [
          *java-opts-small,
          *eureka-env,
          *userdb-env,
          *redis-env,
          *keycloak-jwt,
          *kafka-env,
        ]
      SERVER_PORT: "8083"
      SPRING_KAFKA_PRODUCER_KEY-SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "true"
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
      GRPC_SERVER_PORT: "9095"
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POSTS_NEGOTIATION_TYPE: plaintext
    ports:
      - "8083:8083"
      - "9095:9095"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_started

  messaging-service:
    image: phongga088/messaging-service:latest
    container_name: messaging-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-small]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [*java-opts-small, *eureka-env, *userdb-env, *redis-env, *keycloak-jwt]
      SERVER_PORT: "8095"
      GRPC_SERVER_PORT: "9098"
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
      GRPC_CLIENT_POST-SERVICE_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POST_NEGOTIATION_TYPE: plaintext
    ports:
      - "8095:8095"
      - "9098:9098"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      user-service:
        condition: service_healthy

  notification-service:
    image: phongga088/notification-service:latest
    container_name: notification-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-tiny]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<:
        [
          *java-opts-small,
          *eureka-env,
          *userdb-env,
          *redis-env,
          *keycloak-jwt,
          *kafka-env,
        ]
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE: "1"
      SPRING_KAFKA_CONSUMER_GROUP-ID: notificationGroup
      SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_VALUE_DELEGATE_CLASS: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: org.nexo.notificationservice.dto.MessageDTO
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: org.nexo
      SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: earliest
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
    ports:
      - "8088:8088"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy

  upload-file-service:
    image: phongga088/upload-file-service:latest
    container_name: upload-file-service
    profiles: ["core"]
    <<: [*restart-policy, *res-small]
    logging: *default-logging
    env_file:
      - ./services/upload-file-service/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      <<: [*java-opts-small, *eureka-env, *keycloak-jwt]
      SERVER_PORT: "8086"
      GRPC_SERVER_PORT: "9093"
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
    ports:
      - "8086:8086"
      - "9093:9093"
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      post-service:
        condition: service_started
    networks:
      nexo-network:
        aliases:
          - files

  ai-service:
    image: phongga088/ai-service-v2:latest
    container_name: ai-service
    profiles: ["core"]
    <<: [*restart-policy, *network, *res-tiny]
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_URL: jdbc:postgresql://user-db:5432/userdb
      DB_USER: user
      DB_PASS: pass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: Admin@123
    ports:
      - "8001:8000"
    depends_on:
      - user-db
      - redis

  recommendation-service:
    image: phongga088/recommendation-service:latest
    container_name: recommendation-service
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      SERVICE_PORT: "8000"
      KAFKA_GROUP_ID: recommendation-service-group
      <<: *rec-env
    volumes:
      - recommendation_artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M

  recommendation-consumer:
    image: phongga088/recommendation-service:latest
    container_name: recommendation-consumer
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    command: python kafka_consumer.py
    environment:
      SERVICE_PORT: "8000"
      KAFKA_GROUP_ID: recommendation-consumer-group
      <<: *rec-env
    volumes:
      - recommendation_artifacts:/app/artifacts
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 320M
        reservations:
          cpus: "0.05"
          memory: 160M

  recommendation-worker:
    image: phongga088/recommendation-service:latest
    container_name: recommendation-worker
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    command: celery -A celery_app.celery_app worker --loglevel=warning --pool=solo --concurrency=1
    environment:
      SERVICE_PORT: "8000"
      KAFKA_GROUP_ID: recommendation-worker-group
      <<: *rec-env
    volumes:
      - recommendation_artifacts:/app/artifacts
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M

  recommendation-beat:
    image: phongga088/recommendation-service:latest
    container_name: recommendation-beat
    profiles: ["core"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    command: celery -A celery_app.celery_app beat --loglevel=warning
    environment:
      SERVICE_PORT: "8000"
      KAFKA_GROUP_ID: recommendation-beat-group
      <<: *rec-env
    depends_on:
      - redis
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 64M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["monitoring"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9097
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 96M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-admin-api
    ports:
      - "9091:9090"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 96M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    <<: [*restart-policy, *network]
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ENABLE_GZIP: "true"
      GF_RENDERING_CONCURRENT_RENDER_REQUEST_LIMIT: "2"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 160M
        reservations:
          cpus: "0.05"
          memory: 80M

networks:
  nexo-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"

volumes:
  postgres_data:
  user-db:
  meilisearch_data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  redis_data:
  prometheus_data:
  grafana_data:
  recommendation_artifacts:
