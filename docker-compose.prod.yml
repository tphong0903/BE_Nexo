services:
  api-gateway:
    container_name: api-gateway
    image: phongga088/api-gateway:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nexo-network

  auth-service:
    container_name: auth-service
    image: phongga088/auth-service:latest
    ports:
      - "8081:8081"
      - "9099:9099"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      KEYCLOAK_SERVERURL: http://keycloak:8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GRPC_SERVER_PORT: 9099
      GRPC_CLIENT_USER_SERVICE_ADDRESS: static://user-service:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Admin@123
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nexo-network
  user-service:
    container_name: user-service
    image: phongga088/user-service:latest
    ports:
      - "8085:8085"
      - "9092:9092"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Admin@123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: https://auth.nexosocial.id.vn/realms/nexo-network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: https://auth.nexosocial.id.vn/realms/nexo-network/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GRPC_SERVER_PORT: 9092
      GRPC_CLIENT_UPLOAD-FILE-SERVICE_ADDRESS: static://upload-file-service:9093
      GRPC_CLIENT_AUTH-SERVICE_ADDRESS: static://auth-service:9099
      GRPC_CLIENT_POST-SERVICE_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POST_NEGOTIATION_TYPE: plaintext
      GRPC_CLIENT_MESSAGING-SERVICE_ADDRESS: static://messaging-service:9098
      GRPC_CLIENT_INTERACTION-SERVICE_ADDRESS: static://interaction-service:9095
      GRPC_CLIENT_INTERACTION_NEGOTIATION_TYPE: plaintext
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9097
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_APIKEY: masterKey
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.35"
          memory: 384M
    networks:
      - nexo-network

  recommendation-service:
    container_name: recommendation-service
    image: phongga088/recommendation-service:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      SERVICE_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: Admin@123
      REDIS_TTL_SECONDS: 3600
      USER_SERVICE_BASE_URL: http://user-service:8085
      INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9097
      KAFKA_TOPIC_USER_EVENTS: user_events
      KAFKA_GROUP_ID: recommendation-service-group
      DEFAULT_TOP_K: 10
      EMBEDDING_DIM: 32
      CELERY_BROKER_URL: redis://:Admin@123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:Admin@123@redis:6379/2
      TRANSFORMERS_VERBOSITY: error
    volumes:
      - recommendation_artifacts:/app/artifacts
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - nexo-network

  recommendation-consumer:
    container_name: recommendation-consumer
    image: phongga088/recommendation-service:latest
    command: python kafka_consumer.py
    restart: unless-stopped
    environment:
      SERVICE_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: Admin@123
      REDIS_TTL_SECONDS: 3600
      USER_SERVICE_BASE_URL: http://user-service:8085
      INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9097
      KAFKA_TOPIC_USER_EVENTS: user_events
      KAFKA_GROUP_ID: recommendation-consumer-group
      DEFAULT_TOP_K: 10
      EMBEDDING_DIM: 32
      CELERY_BROKER_URL: redis://:Admin@123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:Admin@123@redis:6379/2
      TRANSFORMERS_VERBOSITY: error
    volumes:
      - recommendation_artifacts:/app/artifacts
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M
    networks:
      - nexo-network

  recommendation-worker:
    container_name: recommendation-worker
    image: phongga088/recommendation-service:latest
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped
    environment:
      SERVICE_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: Admin@123
      REDIS_TTL_SECONDS: 3600
      USER_SERVICE_BASE_URL: http://user-service:8085
      INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9097
      KAFKA_TOPIC_USER_EVENTS: user_events
      KAFKA_GROUP_ID: recommendation-worker-group
      DEFAULT_TOP_K: 10
      EMBEDDING_DIM: 32
      CELERY_BROKER_URL: redis://:Admin@123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:Admin@123@redis:6379/2
      TRANSFORMERS_VERBOSITY: error
    volumes:
      - recommendation_artifacts:/app/artifacts
    depends_on:
      user-service:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 512M
    networks:
      - nexo-network

  recommendation-beat:
    container_name: recommendation-beat
    image: phongga088/recommendation-service:latest
    command: celery -A celery_app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      SERVICE_PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: Admin@123
      REDIS_TTL_SECONDS: 3600
      USER_SERVICE_BASE_URL: http://user-service:8085
      INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-nexo-internal-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9097
      KAFKA_TOPIC_USER_EVENTS: user_events
      KAFKA_GROUP_ID: recommendation-beat-group
      DEFAULT_TOP_K: 10
      EMBEDDING_DIM: 32
      CELERY_BROKER_URL: redis://:Admin@123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:Admin@123@redis:6379/2
      TRANSFORMERS_VERBOSITY: error
    depends_on:
      - user-service
      - redis
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - nexo-network

  post-service:
    container_name: post-service
    image: phongga088/post-service:latest
    ports:
      - "8087:8087"
      - "9094:9094"
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SERVER_PORT: 8087
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Admin@123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: https://auth.nexosocial.id.vn/realms/nexo-network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: https://auth.nexosocial.id.vn/realms/nexo-network/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9097
      SPRING_KAFKA_PRODUCER_KEY-SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: true
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: 5
      SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_ADD_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_GROUP-ID: story-deleter-group
      SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: earliest
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_KEY_DELEGATE_CLASS: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_VALUE_DELEGATE_CLASS: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: "*"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: false
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: org.nexo.postservice.dto.StoryDeletionEvent

      GRPC_SERVER_PORT: 9094
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
      GRPC_CLIENT_INTERACTIONS_ADDRESS: static://interaction-service:9095
      GRPC_CLIENT_INTERACTIONS_NEGOTIATION_TYPE: plaintext
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nexo-network

  upload-file-service:
    container_name: upload-file-service
    image: phongga088/upload-file-service:latest
    ports:
      - "8086:8086"
      - "9093:9093"
    env_file:
      - ./services/upload-file-service/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: https://auth.nexosocial.id.vn/realms/nexo-network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: https://auth.nexosocial.id.vn/realms/nexo-network/protocol/openid-connect/certs
      GRPC_SERVER_PORT: 9093
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      post-service:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      nexo-network:
        aliases:
          - files

  eureka-server:
    container_name: eureka-server
    image: phongga088/eureka-server:latest
    ports:
      - "8761:8761"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - nexo-network

  feed-service:
    container_name: feed-service
    image: phongga088/feed-service:latest
    ports:
      - "8084:8084"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Admin@123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: https://auth.nexosocial.id.vn/realms/nexo-network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: https://auth.nexosocial.id.vn/realms/nexo-network/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9097
      SPRING_KAFKA_CONSUMER_GROUP-ID: feed-service-group
      SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: earliest
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_DESERIALIZER_VALUE_DELEGATE_CLASS: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: org.nexo.feedservice.dto.MessagePostDTO
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED-PACKAGES: org.nexo
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POSTS_NEGOTIATION_TYPE: plaintext
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      post-service:
        condition: service_started
      user-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nexo-network

  interaction-service:
    container_name: interaction-service
    image: phongga088/interaction-service:latest
    ports:
      - "8083:8083"
      - "9095:9095"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Admin@123
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: https://auth.nexosocial.id.vn/realms/nexo-network
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: https://auth.nexosocial.id.vn/realms/nexo-network/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9097
      SPRING_KAFKA_PRODUCER_KEY-SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: true
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: 5
      GRPC_SERVER_PORT: 9095
      GRPC_CLIENT_USERS_ADDRESS: static://user-service:9092
      GRPC_CLIENT_POSTS_ADDRESS: static://post-service:9094
      GRPC_CLIENT_POSTS_NEGOTIATION_TYPE: plaintext
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    deploy:
