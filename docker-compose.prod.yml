          memory: 256M
    networks:
      - nexo-network

  messaging-service:
    container_name: messaging-service
    image: phongga088/messaging-service:latest
    ports:
      - "8095:8095"
      - "9098:9098"
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SERVER_PORT: 8095
