# =============================================
# HTTP - Redirect tất cả sang HTTPS
# + xử lý certbot challenge
# =============================================
server {
    listen 80;
    server_name api.nexosocial.id.vn auth.nexosocial.id.vn;

    # Certbot ACME challenge (dùng để lấy/gia hạn cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================
# HTTPS - API Gateway (domain chính)
# api.nexosocial.id.vn
# =============================================
server {
    listen 443 ssl;
    server_name api.nexosocial.id.vn;

    ssl_certificate     /etc/letsencrypt/live/nexosocial.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexosocial.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://api-gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (messaging service)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# =============================================
# HTTPS - Keycloak (auth subdomain)
# auth.nexosocial.id.vn
# =============================================
server {
    listen 443 ssl;
    server_name auth.nexosocial.id.vn;

    ssl_certificate     /etc/letsencrypt/live/nexosocial.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexosocial.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Keycloak cần buffer lớn hơn cho token response
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
